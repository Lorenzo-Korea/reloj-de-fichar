<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f2937">
<link rel="manifest" href="manifest.webmanifest">
<title>Reloj de Fichar</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#f3f4f6;color:#111827}
.app{max-width:560px;margin:auto;padding:18px 14px 32px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
h1{font-size:24px;margin:0}.week{font-size:14px;color:#6b7280;margin-top:3px}
.card{background:#fff;border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 2px 10px #0000000b}
.nav{display:grid;grid-template-columns:42px 1fr 42px;align-items:center;gap:8px}.nav button{height:40px;font-size:20px;padding:0}
.navcenter{text-align:center}.navcenter b{display:block}.navcenter small{color:#6b7280}
.summary{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.metric{background:#f9fafb;border-radius:14px;padding:13px}.metric small{display:block;color:#6b7280;font-size:12px}.metric strong{font-size:22px}
.target{display:flex;align-items:center;justify-content:space-between;gap:12px}.target select{width:125px;font-size:18px;padding:9px;border:1px solid #d1d5db;border-radius:10px;text-align:center;background:#fff}
.days{display:flex;flex-direction:column;gap:10px}.day{border:1px solid #e5e7eb;border-radius:14px;padding:12px}
.daytop{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px}.dayname{font-weight:700}.worked{font-weight:700}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}.fields label{font-size:12px;color:#6b7280}.fields input{display:block;width:100%;margin-top:4px;padding:10px;border:1px solid #d1d5db;border-radius:10px;font-size:17px}
button{border:0;border-radius:10px;padding:10px 13px;font-weight:700;cursor:pointer}.secondary{background:#e5e7eb;color:#374151}.primary{background:#111827;color:#fff}
.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}.hint{font-size:12px;color:#6b7280;margin-top:10px}
.ok{color:#166534}.over{color:#92400e}.remaining{color:#1d4ed8}
.history{max-height:270px;overflow:auto}.historyrow{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #eee;font-size:14px}.historyrow:last-child{border-bottom:0}
.empty{text-align:center;color:#6b7280;padding:12px}
@media(max-width:380px){.summary{grid-template-columns:1fr}.app{padding:14px 10px}}
</style>
</head>
<body>
<div class="app">
<header>
  <div><h1>Reloj de Fichar</h1><div class="week">Control semanal</div></div>
  <button id="todayBtn" class="secondary">Hoy</button>
</header>

<section class="card">
  <div class="nav">
    <button id="prev" class="secondary">‹</button>
    <div class="navcenter"><b id="weekLabel"></b><small id="weekNumber"></small></div>
    <button id="next" class="secondary">›</button>
  </div>
</section>

<section class="card">
  <div class="target">
    <div><b>Objetivo semanal</b><div class="hint">Independiente para cada semana</div></div>
    <div style="display:flex;gap:5px;align-items:center">
      <select id="targetHours" aria-label="Horas objetivo" style="width:65px"></select>
      <span style="font-weight:700">:</span>
      <select id="targetMinutes" aria-label="Minutos objetivo" style="width:65px"></select>
    </div>
  </div>
</section>

<section class="card summary">
  <div class="metric"><small>Trabajado</small><strong id="total">00:00</strong></div>
  <div class="metric"><small>Restante / exceso</small><strong id="remaining">00:00</strong></div>
</section>

<section class="card">
  <div class="daytop"><b>Fichajes</b><button id="clearWeek" class="secondary">Borrar semana</button></div>
  <div id="days" class="days"></div>
  <div class="hint">El martes tiene doble marcaje: mañana y tarde.</div>
</section>

<section class="card">
  <div class="daytop"><b>Semanas guardadas</b></div>
  <div id="history" class="history"></div>
</section>
</div>

<script>
const DAYS=["Lunes","Martes","Miércoles","Jueves","Viernes"];
const KEY="reloj-fichar-v3";
const pad=n=>String(n).padStart(2,"0");
function monday(d){const x=new Date(d);x.setHours(0,0,0,0);const day=x.getDay();x.setDate(x.getDate()+(day===0?-6:1-day));return x}
function weekKey(d){return monday(d).toISOString().slice(0,10)}
function fmtDate(d){return d.toLocaleDateString("es-ES",{day:"2-digit",month:"2-digit",year:"numeric"})}
function fmtShort(d){return d.toLocaleDateString("es-ES",{day:"2-digit",month:"2-digit"})}
function mins(t){
 if(!t)return null;
 const p=t.split(":").map(Number);
 if(p.length!==2 || !Number.isFinite(p[0]) || !Number.isFinite(p[1]) || p[1]<0 || p[1]>59 || p[0]<0)return null;
 return p[0]*60+p[1];
}
function validTarget(t){
 const n=mins(t);
 return n!==null && n<=2400;
}
function hhmm(n){n=Math.max(0,Math.round(n));return `${pad(Math.floor(n/60))}:${pad(n%60)}`}
function blankDay(i){return i===1?{in1:"",out1:"",in2:"",out2:""}:{in1:"",out1:""}}
function blankWeek(){return {target:"37:00",days:DAYS.map((_,i)=>blankDay(i))}}
function load(){try{return JSON.parse(localStorage.getItem(KEY)||"{}")}catch{return {}}}
function save(db){localStorage.setItem(KEY,JSON.stringify(db))}
let db=load(), current=monday(new Date());

function migrateWeek(w){
 if(!w)return blankWeek();
 const nw={target:w.target||"37:00",days:DAYS.map((_,i)=>blankDay(i))};
 DAYS.forEach((_,i)=>{
   const old=w.days?.[i]||{};
   nw.days[i].in1=old.in1||old.in||"";
   nw.days[i].out1=old.out1||old.out||"";
   if(i===1){nw.days[i].in2=old.in2||"";nw.days[i].out2=old.out2||"";}
 });
 return nw;
}
function period(a,b){
 if(!a||!b)return 0;
 let x=mins(a),y=mins(b);if(y<x)y+=1440;
 return Math.max(0,y-x);
}
function calc(w){
 let total=0;
 w.days.forEach((r,i)=>{total+=period(r.in1,r.out1);if(i===1)total+=period(r.in2,r.out2)});
 return total;
}
function renderHistory(){
 const box=document.getElementById("history");
 const keys=Object.keys(db).sort().reverse();
 if(!keys.length){box.innerHTML='<div class="empty">Todavía no hay semanas guardadas.</div>';return}
 box.innerHTML="";
 keys.forEach(k=>{
   const d=monday(new Date(k+"T00:00:00")),w=migrateWeek(db[k]),t=calc(w),goal=mins(w.target)||0,diff=goal-t;
   const row=document.createElement("div");row.className="historyrow";
   row.innerHTML=`<span><b>Semana ${fmtShort(d)}</b><br><small>${fmtShort(new Date(d.getTime()+4*86400000))} · objetivo ${w.target}</small></span><b>${hhmm(t)} ${diff<0?"✓":""}</b>`;
   row.onclick=()=>{current=d;render()};
   row.style.cursor="pointer";box.appendChild(row);
 });
}
function render(){
 const key=weekKey(current),w=migrateWeek(db[key]);db[key]=w;save(db);
 document.getElementById("weekLabel").textContent=`${fmtDate(current)} – ${fmtDate(new Date(current.getTime()+4*86400000))}`;
 document.getElementById("weekNumber").textContent="Pulsa ‹ o › para cambiar de semana";
 const targetHours=document.getElementById("targetHours");
 const targetMinutes=document.getElementById("targetMinutes");
 const targetTotal=mins(w.target)||2220;
 const selectedHours=Math.floor(targetTotal/60), selectedMinutes=targetTotal%60;
 targetHours.innerHTML="";
 for(let h=0;h<=40;h++){
   const opt=document.createElement("option");
   opt.value=h; opt.textContent=String(h).padStart(2,"0");
   if(h===selectedHours) opt.selected=true;
   targetHours.appendChild(opt);
 }
 targetMinutes.innerHTML="";
 for(let m=0;m<=59;m++){
   const opt=document.createElement("option");
   opt.value=m; opt.textContent=String(m).padStart(2,"0");
   if(m===selectedMinutes) opt.selected=true;
   targetMinutes.appendChild(opt);
 }
 const days=document.getElementById("days");days.innerHTML="";
 let total=0;
 DAYS.forEach((name,i)=>{
   const rec=w.days[i];let worked=period(rec.in1,rec.out1);if(i===1)worked+=period(rec.in2,rec.out2);total+=worked;
   const fields=i===1?
   `<label>Entrada mañana<input type="time" data-i="${i}" data-k="in1" value="${rec.in1}"></label>
    <label>Salida mañana<input type="time" data-i="${i}" data-k="out1" value="${rec.out1}"></label>
    <label>Entrada tarde<input type="time" data-i="${i}" data-k="in2" value="${rec.in2}"></label>
    <label>Salida tarde<input type="time" data-i="${i}" data-k="out2" value="${rec.out2}"></label>`:
   `<label>Entrada<input type="time" data-i="${i}" data-k="in1" value="${rec.in1}"></label>
    <label>Salida<input type="time" data-i="${i}" data-k="out1" value="${rec.out1}"></label>`;
   const el=document.createElement("div");el.className="day";
   el.innerHTML=`<div class="daytop"><span class="dayname">${name}</span><span class="worked">${worked?hhmm(worked):"—"}</span></div><div class="fields">${fields}</div>`;
   days.appendChild(el);
 });
 const target=mins(w.target)||0,diff=target-total;
 document.getElementById("total").textContent=hhmm(total);
 const rem=document.getElementById("remaining");rem.textContent=diff>0?hhmm(diff):diff<0?`+${hhmm(-diff)}`:"00:00";rem.className=diff>0?"remaining":diff<0?"over":"ok";
 days.querySelectorAll("input").forEach(inp=>inp.addEventListener("change",e=>{
   db[key].days[+e.target.dataset.i][e.target.dataset.k]=e.target.value;save(db);render();
 }));
 const updateTarget=()=>{
   const h=Number(document.getElementById("targetHours").value);
   const m=Number(document.getElementById("targetMinutes").value);
   db[key].target=hhmm(h*60+m);save(db);render();
 };
 document.getElementById("targetHours").onchange=updateTarget;
 document.getElementById("targetMinutes").onchange=updateTarget;
 renderHistory();
}
document.getElementById("prev").onclick=()=>{current=new Date(current.getTime()-7*86400000);render()};
document.getElementById("next").onclick=()=>{current=new Date(current.getTime()+7*86400000);render()};
document.getElementById("todayBtn").onclick=()=>{current=monday(new Date());render()};
document.getElementById("clearWeek").onclick=()=>{if(confirm("¿Borrar todos los fichajes de esta semana?")){delete db[weekKey(current)];save(db);render()}};
render();
</script>
</body>
</html>
